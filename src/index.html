<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Performance Lab Angular — Frontend Optimization, Measured</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive Angular 21 lab that measures frontend optimization: virtual scrolling vs full rendering, @defer, signals and zoneless change detection — with real numbers."
    />
    <meta name="theme-color" content="#0a0e13" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme before first paint to avoid flashing
      (function () {
        try {
          var t = localStorage.getItem('perf-lab.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
